<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Log — PPL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0d0f12; --panel:#16191e; --panel-hi:#1e2228; --line:#2a2f37;
    --text:#e8eaed; --muted:#7c828d; --accent:#ff5c2b; --accent-dim:#7a2e18;
    --done:#35c26a; --push:#ff5c2b; --pull:#3b9dff; --legs:#b06bff;
  }
  body{ background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; padding-bottom:40px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }
  header{ padding:28px 16px 18px; max-width:640px; margin:0 auto; display:flex; align-items:baseline; justify-content:space-between; }
  .brand{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:34px; letter-spacing:1px; text-transform:uppercase; line-height:.9; }
  .brand span{ color:var(--accent); }
  .brand small{ display:block; font-family:'Barlow',sans-serif; font-weight:500; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-top:4px; }
  .rotation-tag{ font-family:'Barlow Condensed',sans-serif; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); text-align:right; }
  .rotation-tag b{ color:var(--text); font-weight:700; }
  .setup-toggle{ display:flex; gap:8px; margin:6px 0 12px; }
  .su-btn{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px; text-transform:uppercase; padding:11px; border-radius:10px; cursor:pointer; transition:all .15s; }
  .su-btn.sel{ border-color:var(--accent); color:var(--text); background:var(--accent-dim); }
  .days{ display:flex; gap:8px; margin:8px 0 14px; }
  .day-pill{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 8px; cursor:pointer; text-align:center; transition:border-color .15s,background .15s; position:relative; }
  .day-pill .lbl{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; letter-spacing:.5px; text-transform:uppercase; }
  .day-pill .sub{ font-size:10px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-top:2px; }
  .day-pill.active{ background:var(--panel-hi); }
  .day-pill[data-day="push"].active{ border-color:var(--push); }
  .day-pill[data-day="pull"].active{ border-color:var(--pull); }
  .day-pill[data-day="legs"].active{ border-color:var(--legs); }
  .day-pill .next-dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--accent); display:none; }
  .day-pill.is-next .next-dot{ display:block; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .tool-btn{ flex:1 1 calc(50% - 4px); background:var(--panel); border:1px solid var(--line); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:1px; text-transform:uppercase; padding:9px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tool-btn:active{ border-color:var(--accent); }
  .conv-panel{ display:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .conv-panel.open{ display:block; }
  .conv-row{ display:flex; align-items:center; gap:12px; }
  .conv-field{ flex:1; position:relative; }
  .conv-in{ width:100%; background:var(--panel-hi); border:1px solid var(--line); border-radius:9px; color:var(--text); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; padding:12px 44px 12px 14px; outline:none; }
  .conv-in:focus{ border-color:var(--accent); }
  .conv-unit{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px; text-transform:uppercase; }
  .conv-eq{ color:var(--accent); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; }
  .conv-quick{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .conv-chip{ background:var(--panel-hi); border:1px solid var(--line); color:var(--muted); font-size:11px; padding:5px 9px; border-radius:20px; cursor:pointer; font-family:'Barlow',sans-serif; }
  .conv-chip:active{ border-color:var(--accent); color:var(--text); }
  .prog-head{ margin-bottom:12px; }
  .prog-title{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; letter-spacing:.5px; text-transform:uppercase; }
  .prog-sub{ font-size:11px; color:var(--muted); letter-spacing:.5px; margin-top:2px; }
  #volChart{ width:100%; height:auto; display:block; }
  .prog-legend{ display:flex; gap:16px; justify-content:center; margin-top:10px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .prog-legend span{ display:flex; align-items:center; gap:5px; }
  .prog-legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  .prog-stats{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .stat{ flex:1; min-width:90px; background:var(--panel-hi); border:1px solid var(--line); border-radius:9px; padding:10px 12px; text-align:center; }
  .stat .v{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; color:var(--text); }
  .stat .l{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
  .prog-empty{ text-align:center; color:var(--muted); padding:30px 10px; font-size:13px; line-height:1.5; }
  .rec-rec{ background:var(--panel-hi); border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:14px; font-size:13px; line-height:1.4; }
  .rec-rec b{ font-family:'Barlow Condensed'; text-transform:uppercase; letter-spacing:.5px; }
  .rec-list{ display:flex; flex-direction:column; gap:8px; }
  .rec-row{ display:flex; align-items:center; gap:10px; }
  .rec-name{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15px; width:88px; flex-shrink:0; letter-spacing:.3px; }
  .rec-track{ flex:1; height:9px; background:var(--panel-hi); border-radius:5px; overflow:hidden; }
  .rec-bar{ height:100%; border-radius:5px; transition:width .3s; }
  .rec-meta{ font-size:11px; color:var(--muted); width:66px; flex-shrink:0; text-align:right; }
  .rec-tag{ font-size:9px; text-transform:uppercase; letter-spacing:1px; padding:2px 6px; border-radius:4px; flex-shrink:0; width:74px; text-align:center; }
  .rec-fresh{ background:rgba(53,194,106,.18); color:#6fe39a; }
  .rec-recov{ background:rgba(255,180,40,.16); color:#ffc04d; }
  .rec-cooked{ background:rgba(255,92,43,.16); color:#ff8a5c; }
  .prof-grid{ display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; }
  .prof-field{ flex:1; }
  .prof-field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:5px; }
  .conv-in.sm{ font-size:20px; padding:10px 12px; }
  .tool-btn.logbw{ flex:0 0 auto; padding:12px 16px; background:var(--accent); color:#1a0800; border:none; }
  .prof-latest{ font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .prof-latest b{ color:var(--text); }
  .tool-btn.export{ width:100%; }
  .plate-calc{ margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
  .plate-out{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:20px; }
  .plate-chip{ background:var(--accent-dim); color:#ffd0bd; border:1px solid var(--accent); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; padding:4px 10px; border-radius:6px; }
  .plate-none{ color:var(--muted); font-size:12px; }
  .chart-toggle{ display:flex; gap:6px; }
  .ct-btn{ background:var(--panel-hi); border:1px solid var(--line); color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12px; letter-spacing:.5px; text-transform:uppercase; padding:5px 12px; border-radius:6px; cursor:pointer; }
  .ct-btn.sel{ border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .pr-badge{ font-size:12px; margin-left:2px; }
  .core-head,.pu-head{ display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin:14px 0 12px; }
  .core-title,.pu-title{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; letter-spacing:.5px; text-transform:uppercase; }
  .core-focus,.pu-focus{ font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.3px; }
  .core-switch{ width:46px; height:26px; border-radius:14px; background:var(--panel-hi); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s; }
  .core-switch span{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:transform .18s,background .18s; }
  .core-switch.on{ background:var(--accent-dim); border-color:var(--accent); }
  .core-switch.on span{ transform:translateX(20px); background:var(--accent); }
  .core-ex{ border-left:3px solid var(--accent); }
  .pu-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .pu-level-nav{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pu-lvl-btn{ background:var(--panel-hi); border:1px solid var(--line); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; padding:6px 10px; border-radius:7px; cursor:pointer; }
  .pu-lvl-btn:disabled{ opacity:.3; cursor:default; }
  .pu-lvl-name{ flex:1; text-align:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; }
  .pu-dots{ display:flex; gap:5px; justify-content:center; margin-bottom:12px; }
  .pu-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .pu-dot.on{ background:var(--accent); }
  .pu-note{ font-size:12px; color:var(--muted); font-style:italic; margin-bottom:12px; line-height:1.4; text-align:center; }
  .pu-levelup{ width:100%; background:var(--done); color:#06210f; border:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px; text-transform:uppercase; padding:11px; border-radius:9px; cursor:pointer; margin-top:10px; }
  .today-banner{ background:linear-gradient(90deg,var(--accent-dim),transparent); border-left:3px solid var(--accent); padding:10px 14px; border-radius:0 8px 8px 0; margin-bottom:16px; font-size:13px; color:var(--text); }
  .today-banner b{ font-family:'Barlow Condensed'; letter-spacing:.5px; text-transform:uppercase; }
  .set-today{ background:var(--accent); color:#1a0800; border:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:.5px; text-transform:uppercase; padding:4px 10px; border-radius:6px; cursor:pointer; margin-left:6px; white-space:nowrap; }
  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .bar{ flex:1; height:6px; background:var(--panel); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; width:0; background:var(--done); border-radius:3px; transition:width .3s; }
  .prog-txt{ font-family:'Barlow Condensed'; font-size:14px; color:var(--muted); letter-spacing:.5px; }
  .ex{ background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .ex-head{ display:flex; align-items:center; padding:13px 14px; gap:12px; }
  .ex-num{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; color:var(--bg); background:var(--muted); min-width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ex.done-all .ex-num{ background:var(--done); }
  .ex-title{ flex:1; min-width:0; }
  .ex-name{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:19px; letter-spacing:.3px; line-height:1; display:flex; align-items:center; gap:7px; }
  .swap-btn{ background:var(--panel-hi); border:1px solid var(--line); color:var(--muted); font-size:11px; font-family:'Barlow',sans-serif; padding:2px 8px; border-radius:20px; cursor:pointer; letter-spacing:.5px; flex-shrink:0; }
  .swap-btn:active{ border-color:var(--accent); color:var(--accent); }
  .ex-target{ font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.3px; }
  .howto{ color:var(--accent); text-decoration:none; font-weight:600; }
  .howto:active{ opacity:.6; }
  .opt-howto{ color:var(--accent); text-decoration:none; font-size:13px; padding:0 6px; }
  .ex-scheme{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15px; color:var(--accent); letter-spacing:.5px; flex-shrink:0; }
  .ex-note{ font-size:12px; color:var(--muted); padding:0 14px 10px 50px; line-height:1.4; font-style:italic; }
  .hint{ margin:0 14px 12px 50px; font-family:'Barlow',sans-serif; font-size:12.5px; padding:7px 11px; border-radius:8px; display:inline-flex; align-items:center; gap:4px; letter-spacing:.2px; }
  .hint b{ font-weight:600; }
  .hint.up{ background:rgba(53,194,106,.12); color:#6fe39a; border:1px solid rgba(53,194,106,.3); }
  .hint.up b{ color:var(--done); }
  .hint.hold{ background:var(--panel-hi); color:var(--muted); border:1px solid var(--line); }
  .hint.hold b{ color:var(--text); }
  .hint .pin{ font-size:10px; text-transform:uppercase; letter-spacing:1px; background:rgba(53,194,106,.2); padding:2px 6px; border-radius:4px; margin-left:2px; }
  .options{ padding:0 14px 12px 50px; display:none; }
  .options.open{ display:block; }
  .opt{ display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:14px; background:var(--panel-hi); transition:border-color .12s; }
  .opt:active{ border-color:var(--accent); }
  .opt.sel{ border-color:var(--accent); background:var(--accent-dim); }
  .opt .dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); flex-shrink:0; }
  .opt.sel .dot{ border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 2px var(--accent-dim); }
  .opt .oname{ flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px; }
  .opt .otag{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .sets{ display:flex; flex-wrap:wrap; gap:10px; padding:0 14px 14px 50px; }
  .set{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .set-btn{ width:42px; height:42px; border-radius:9px; border:1.5px solid var(--line); background:var(--panel-hi); color:var(--muted); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px; cursor:pointer; transition:all .12s; }
  .set-btn.done{ background:var(--done); border-color:var(--done); color:#06210f; }
  .wr{ display:flex; align-items:center; gap:3px; }
  .wx{ color:var(--muted); font-size:12px; }
  .set-wt,.set-reps{ width:38px; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text); text-align:center; font-family:'Barlow',sans-serif; font-size:12px; padding:2px 0; outline:none; }
  .set-wt:focus,.set-reps:focus{ border-color:var(--accent); }
  .set-wt::placeholder,.set-reps::placeholder{ color:#454b54; }
  .actions{ display:flex; gap:10px; margin-top:22px; }
  .btn{ flex:1; padding:15px; border-radius:11px; border:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:filter .15s; }
  .btn:active{ filter:brightness(1.15); }
  .btn-finish{ background:var(--accent); color:#1a0800; }
  .btn-reset{ background:var(--panel); color:var(--muted); border:1px solid var(--line); flex:0 0 auto; padding:15px 20px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(100px); background:var(--done); color:#06210f; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:.5px; padding:13px 24px; border-radius:30px; text-transform:uppercase; transition:transform .3s cubic-bezier(.2,.8,.3,1); z-index:50; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .loading{ text-align:center; color:var(--muted); padding:40px; font-family:'Barlow Condensed'; letter-spacing:1px; }
  body.timer-open{ padding-bottom:118px; }
  .rest-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:40; transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.3,1); box-shadow:0 -8px 30px rgba(0,0,0,.4); }
  .rest-bar.up{ transform:translateY(0); }
  .rest-inner{ max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .rest-count{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:40px; letter-spacing:1px; min-width:96px; line-height:1; font-variant-numeric:tabular-nums; color:var(--accent); }
  .rest-count.rested{ color:var(--done); }
  .rest-mid{ flex:1; }
  .rest-label{ font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .rest-presets{ display:flex; gap:6px; }
  .preset{ flex:1; background:var(--panel-hi); border:1px solid var(--line); color:var(--text); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14px; letter-spacing:.5px; padding:8px 0; border-radius:8px; cursor:pointer; transition:border-color .12s,background .12s; }
  .preset:active,.preset.sel{ border-color:var(--accent); background:var(--accent-dim); }
  .rest-x{ background:none; border:none; color:var(--muted); font-size:26px; cursor:pointer; padding:4px 8px; line-height:1; align-self:flex-start; }
  .rest-toggle{ background:var(--accent); color:#1a0800; border:none; width:46px; height:46px; border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<header>
  <div class="brand">Iron<span>Log</span><small>Push · Pull · Legs</small></div>
  <div class="rotation-tag" id="rotationTag"></div>
</header>
<div class="wrap">
  <div class="setup-toggle">
    <button class="su-btn" data-setup="gym">🏋️ Main Gym</button>
    <button class="su-btn" data-setup="home">🏠 Home Gym</button>
  </div>
  <div class="days" id="dayPills"></div>
  <div class="toolbar">
    <button class="tool-btn" id="recoveryBtn">🔥 Recovery</button>
    <button class="tool-btn" id="progressBtn">📈 Progress</button>
    <button class="tool-btn" id="profileBtn">👤 Profile</button>
    <button class="tool-btn" id="shuffleBtn">🎲 Shuffle</button>
    <button class="tool-btn" id="convBtn">⇄ kg/lb</button>
  </div>
  <div class="conv-panel" id="profPanel">
    <div class="prog-head"><div class="prog-title">Profile</div><div class="prog-sub">height &amp; bodyweight — used for setup cues and your trend</div></div>
    <div class="prof-grid">
      <div class="prof-field"><label>Height</label><input class="conv-in sm" id="profHeight" inputmode="decimal" placeholder="cm"></div>
      <div class="prof-field"><label>Bodyweight</label><input class="conv-in sm" id="profBw" inputmode="decimal" placeholder="lb"></div>
      <button class="tool-btn logbw" id="logBwBtn">＋ Log</button>
    </div>
    <div class="prof-latest" id="profLatest"></div>
    <button class="tool-btn export" id="exportBtn">⬇︎ Backup my data (download)</button>
  </div>
  <div class="conv-panel" id="recPanel">
    <div class="prog-head">
      <div class="prog-title">Muscle recovery</div>
      <div class="prog-sub" id="recRec">based on when you last trained each group</div>
    </div>
    <div class="rec-list" id="recList"></div>
  </div>
  <div class="conv-panel" id="progPanel">
    <div class="prog-head">
      <div class="prog-title">Progress</div>
      <div class="chart-toggle">
        <button class="ct-btn sel" data-mode="volume">Volume</button>
        <button class="ct-btn" data-mode="bw">Bodyweight</button>
      </div>
    </div>
    <canvas id="volChart" width="600" height="240"></canvas>
    <div class="prog-legend">
      <span><i style="background:#ff5c2b"></i>Push</span>
      <span><i style="background:#3b9dff"></i>Pull</span>
      <span><i style="background:#b06bff"></i>Legs</span>
    </div>
    <div class="prog-stats" id="progStats"></div>
  </div>
  <div class="conv-panel" id="convPanel">
    <div class="conv-row">
      <div class="conv-field">
        <input class="conv-in" id="convKg" inputmode="decimal" placeholder="0">
        <span class="conv-unit">kg</span>
      </div>
      <span class="conv-eq">=</span>
      <div class="conv-field">
        <input class="conv-in" id="convLb" inputmode="decimal" placeholder="0">
        <span class="conv-unit">lb</span>
      </div>

function sessionVolume(key){

  });

    CORE[key].slots.forEach((slot,si)=>{
      const n=setCount(slot.scheme);
      for(let s=0;s<n;s++){ const rec=logs[`c${si}-${s}`]||{}; if(rec.done){ const w=parseFloat(rec.wt)||0, r=parseFloat(rec.reps)||0; vol+=w*r; } }
    });

function updateProgress(){
  const key=currentDayKey(), day=P()[key], logs=state.logs[key]||{};
  let total=0,done=0;
  day.slots.forEach((slot,si)=>{ const n=setCount(slot.scheme); for(let s=0;s<n;s++){ total++; if((logs[`${si}-${s}`]||{}).done) done++; } });
  if((state.coreOn||{})[key]){

  }
  document.getElementById('barFill').style.width=total?(done/total*100)+'%':'0';
  document.getElementById('barFill').style.background=day.color;

  document.getElementById('progTxt').innerHTML=`${done} / ${total} sets` + (vol>0?` · <b>${vol.toLocaleString()}</b> lb`:'');
}

const Rest={ dur:90,left:90,running:false,tick:null,endAt:0,
  bar:document.getElementById('restBar'), countEl:document.getElementById('restCount'), toggleEl:document.getElementById('restToggle'),
  fmt(s){ const m=Math.floor(s/60),ss=s%60; return `${m}:${ss.toString().padStart(2,'0')}`; },
  paint(){ this.countEl.textContent=this.fmt(Math.max(0,this.left)); this.countEl.classList.toggle('rested',this.left<=0); this.toggleEl.textContent=this.running?'❚❚':'▶'; },
  open(){ this.bar.classList.add('up'); document.body.classList.add('timer-open'); },
  start(sec){ if(sec!=null){ this.dur=sec; this.left=sec; } if(this.left<=0) this.left=this.dur;
    this.open(); this.running=true; this.endAt=Date.now()+this.left*1000;
    clearInterval(this.tick); this.tick=setInterval(()=>this._tick(),250); this.paint(); },
  _tick(){ if(!this.running) return;
    this.left=Math.max(0,Math.round((this.endAt-Date.now())/1000));
    if(this.left<=0){ this.stop(); this.done(); } this.paint(); },
  stop(){ this.running=false; clearInterval(this.tick); this.paint(); },
  toggle(){ if(this.running){ this.left=Math.max(0,Math.round((this.endAt-Date.now())/1000)); this.stop(); } else { if(this.left<=0) this.left=this.dur; this.start(); } },
  close(){ this.stop(); this.bar.classList.remove('up'); document.body.classList.remove('timer-open'); },
  done(){ toast('Rest done — go');
    try{ const ac=new (window.AudioContext||window.webkitAudioContext)();
      [0,0.18,0.36].forEach(t=>{ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.001,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.15); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.16); }); }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,80,200]); }
};

// ---- Progress chart ----
const DAYCOL={ push:'#ff5c2b', pull:'#3b9dff', legs:'#b06bff' };
const progPanel=document.getElementById('progPanel');
function weekStreak(){
  const sessions=(state.sessions||[]); if(!sessions.length) return 0;
  const wk=t=>{ const d=new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); };
  const weeks=new Set(sessions.map(s=>wk(s.ts)));
  let streak=0, cur=wk(Date.now());
  // allow current week even if empty (grace), then count back
  if(!weeks.has(cur)) cur-=7*864e5;
  while(weeks.has(cur)){ streak++; cur-=7*864e5; }
  return streak;
}
function drawChart(){
  const sessions=(state.sessions||[]);
  const bwData=(state.bodyweight||[]);
  const stats=document.getElementById('progStats');
  const cv=document.getElementById('volChart');
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const padL=44, padR=12, padT=14, padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  ctx.font='11px Barlow, sans-serif'; ctx.textAlign='right';

  if(chartMode==='bw'){
    if(bwData.length===0){
      stats.innerHTML=`<div class="prog-empty">No bodyweight logged yet.<br>Open 👤 Profile and log your weight to see the trend.</div>`;
      return;
    }
    const data=bwData.slice(-30);
    const ws=data.map(d=>d.w); const minW=Math.min(...ws)-1, maxW=Math.max(...ws)+1;
    const range=maxW-minW||1;
    ctx.fillStyle='#7c828d'; ctx.strokeStyle='#2a2f37'; ctx.lineWidth=1;
    for(let i=0;i<=4;i++){ const y=padT+plotH-(plotH*i/4); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText(Math.round(minW+range*i/4), padL-6, y+3); }
    ctx.strokeStyle='#35c26a'; ctx.lineWidth=2.5; ctx.beginPath();
    data.forEach((d,i)=>{ const x=padL+(data.length===1?plotW/2:plotW*i/(data.length-1)); const y=padT+plotH-((d.w-minW)/range)*plotH; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    ctx.fillStyle='#35c26a';
    data.forEach((d,i)=>{ const x=padL+(data.length===1?plotW/2:plotW*i/(data.length-1)); const y=padT+plotH-((d.w-minW)/range)*plotH; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill(); });
    const first=data[0].w, last=data[data.length-1].w, diff=round1(last-first);
    stats.innerHTML=`
      <div class="stat"><div class="v">${last}</div><div class="l">Current lb</div></div>
      <div class="stat"><div class="v">${diff>0?'+':''}${diff}</div><div class="l">Change</div></div>
      <div class="stat"><div class="v">${bwData.length}</div><div class="l">Entries</div></div>`;
    return;
  }

  if(sessions.length===0){
    stats.innerHTML=`<div class="prog-empty">No sessions logged yet.<br>Finish a workout (with weights &amp; reps filled in) and your volume shows up here.</div>`;
    return;
  }
  const data=sessions.slice(-20);
  const maxV=Math.max(...data.map(s=>s.vol));
  ctx.fillStyle='#7c828d'; ctx.strokeStyle='#2a2f37'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=padT+plotH-(plotH*i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    const val=Math.round(maxV*i/4);
    ctx.fillText(val>=1000?(val/1000).toFixed(1)+'k':val, padL-6, y+3);
  }
  const bw=Math.min(38,(plotW/data.length)-4);
  data.forEach((s,i)=>{
    const x=padL + i*(plotW/data.length) + ((plotW/data.length)-bw)/2;
    const h=maxV?(s.vol/maxV)*plotH:0; const y=padT+plotH-h;
    ctx.fillStyle=DAYCOL[s.day]||'#888';
    ctx.beginPath(); const r=3;
    ctx.moveTo(x,y+h); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.lineTo(x+bw-r,y); ctx.arcTo(x+bw,y,x+bw,y+r,r); ctx.lineTo(x+bw,y+h); ctx.closePath(); ctx.fill();
  });
  const best=Math.max(...sessions.map(s=>s.vol));
  const now=Date.now(), weekAgo=now-7*864e5;
  const thisWeek=sessions.filter(s=>s.ts>=weekAgo).length;
  const avg=Math.round(sessions.reduce((a,s)=>a+s.vol,0)/sessions.length);
  const fmt=v=>v>=1000?(v/1000).toFixed(1)+'k':v;
  stats.innerHTML=`
    <div class="stat"><div class="v">${sessions.length}</div><div class="l">Workouts</div></div>
    <div class="stat"><div class="v">${fmt(best)}</div><div class="l">Best volume</div></div>
    <div class="stat"><div class="v">${weekStreak()}</div><div class="l">Week streak</div></div>
    <div class="stat"><div class="v">${thisWeek}</div><div class="l">This week</div></div>`;
}

  if(progPanel.classList.contains('open')) drawChart();

const MUSCLE_ORDER=['Chest','Shoulders','Triceps','Back','Rear delts','Biceps','Quads','Hamstrings','Glutes','Calves','Core'];

function muscleDay(m){ for(const d of ORDER){ if(DAY_MUSCLES[d].includes(m)) return d; } return null; }
function hoursSince(muscle){

}
function agoText(h){
  if(h==null) return 'not yet';
  if(h<1) return 'just now';
  if(h<24) return Math.round(h)+'h ago';
  const d=Math.floor(h/24); return d+(d===1?' day':' days')+' ago';
}
function drawRecovery(){
  const list=document.getElementById('recList');
  const rec=document.getElementById('recRec');
  // per-day readiness = min recovery% across its muscles
  const dayScore={};
  ORDER.forEach(d=>{
    const hs=DAY_MUSCLES[d].map(m=>{ const h=hoursSince(m); return h==null?RECOVER_H:Math.min(h,RECOVER_H); });
    dayScore[d]=Math.min(...hs)/RECOVER_H; // 0..1
  });
  const best=ORDER.slice().sort((a,b)=>dayScore[b]-dayScore[a])[0];
  const pct=Math.round(dayScore[best]*100);
  const allCooked=ORDER.every(d=>dayScore[d]<0.5);
  if(allCooked){
    rec.innerHTML=`😮‍💨 <b>Everything's still cooked.</b> Every group trained recently — a rest day (or light cardio) would do more than lifting today.`;
  } else {
    rec.innerHTML=`Most recovered: <b style="color:${DAYCOL[best]}">${P()[best].label}</b> — ${pct>=100?'fully fresh, good to train':'freshest group right now'}`;
  }

  list.innerHTML=MUSCLE_ORDER.map(m=>{
    const h=hoursSince(m);
    const recov=h==null?1:Math.min(h/RECOVER_H,1);
    const pctv=Math.round(recov*100);
    let tag,cls,col;
    if(recov>=1){ tag='Fresh'; cls='rec-fresh'; col='#35c26a'; }
    else if(recov>=0.5){ tag='Recovering'; cls='rec-recov'; col='#ffb428'; }
    else { tag='Cooked'; cls='rec-cooked'; col='#ff5c2b'; }
    return `<div class="rec-row">
      <div class="rec-name">${m}</div>
      <div class="rec-track"><div class="rec-bar" style="width:${pctv}%;background:${col}"></div></div>
      <div class="rec-tag ${cls}">${tag}</div>
      <div class="rec-meta">${agoText(h)}</div></div>`;
  }).join('');
}
document.getElementById('recoveryBtn').onclick=()=>{
  recPanel.classList.toggle('open');
  if(recPanel.classList.contains('open')) drawRecovery();
};

// ---- PRs ----
function checkPR(name, wt){
  if(!name || isNaN(wt) || wt<=0) return;
  if(!state.prs) state.prs={};
  const prev=state.prs[name];
  if(prev==null){ state.prs[name]=wt; return; } // first-ever, set silently
  if(wt>prev){
    state.prs[name]=wt;
    if(!state.prSession) state.prSession={};
    state.prSession[name]=wt;
    toast('🏆 New PR — '+name+' '+wt);
  }
}

// ---- Profile: height + bodyweight ----
const profPanel=document.getElementById('profPanel');
const profHeight=document.getElementById('profHeight'), profBw=document.getElementById('profBw');
function renderProfile(){
  if(state.profile&&state.profile.height) profHeight.value=state.profile.height;
  const bw=state.bodyweight||[];
  const latest=bw.length?bw[bw.length-1]:null;
  const el=document.getElementById('profLatest');
  if(latest){
    const d=new Date(latest.ts); const ago=Math.floor((Date.now()-latest.ts)/864e5);
    el.innerHTML=`Latest bodyweight: <b>${latest.w} lb</b> <span style="color:var(--muted)">(${ago===0?'today':ago+'d ago'})</span> · ${bw.length} entr${bw.length===1?'y':'ies'} logged`;
  } else { el.innerHTML='No bodyweight logged yet — add one to start your trend.'; }
}
document.getElementById('profileBtn').onclick=()=>{ profPanel.classList.toggle('open'); if(profPanel.classList.contains('open')) renderProfile(); };
profHeight.onchange=()=>{ if(!state.profile) state.profile={}; state.profile.height=profHeight.value; save(); };
document.getElementById('logBwBtn').onclick=()=>{
  const w=parseFloat(profBw.value);
  if(isNaN(w)||w<=0){ toast('Enter a bodyweight'); return; }
  if(!state.bodyweight) state.bodyweight=[];
  state.bodyweight.push({ts:Date.now(), w}); save(); profBw.value=''; renderProfile(); toast('Bodyweight logged');
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='iron-log-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup downloaded');
};

// ---- Plate calculator (kg per side, 20kg bar) ----
const KG_PLATES=[25,20,15,10,5,2.5,1.25];
const plateTarget=document.getElementById('plateTarget');
if(plateTarget) plateTarget.oninput=()=>{
  const out=document.getElementById('plateOut');
  const t=parseFloat(plateTarget.value);
  if(isNaN(t)||t<20){ out.innerHTML='<span class="plate-none">Enter a target of 20 kg or more (bar = 20).</span>'; return; }
  let perSide=(t-20)/2;
  if(perSide<0){ out.innerHTML='<span class="plate-none">Below bar weight.</span>'; return; }
  const chips=[]; let rem=perSide;
  KG_PLATES.forEach(p=>{ let c=0; while(rem>=p-0.001){ rem-=p; c++; } if(c) chips.push(`${c}×${p}`); });
  out.innerHTML = chips.length
    ? chips.map(c=>`<span class="plate-chip">${c}</span>`).join('') + (rem>0.01?`<span class="plate-none">(+${round1(rem)}kg over)</span>`:'')
    : '<span class="plate-none">Just the bar.</span>';
};

// ---- Chart mode toggle ----
let chartMode='volume';
document.querySelectorAll('.ct-btn').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('.ct-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
  chartMode=b.dataset.mode; drawChart();
}; });
// quick-reference chips: common kg loads -> lb
const commonKg=[20,25,40,50,60,70,80,100];
document.getElementById('convQuick').innerHTML = commonKg.map(k=>`<span class="conv-chip" data-kg="${k}">${k}kg = ${round1(k*KG_TO_LB)}lb</span>`).join('');
document.querySelectorAll('.conv-chip').forEach(c=>{ c.onclick=()=>{ convKg.value=c.dataset.kg; convKg.oninput(); }; });

document.getElementById('shuffleBtn').onclick=()=>{
  const key=currentDayKey();
  state.picks[key]=P()[key].slots.map(sl=>Math.floor(Math.random()*sl.options.length));
  openSlot=null; save(); render(); toast('Day shuffled');
};
const _rp=document.getElementById('resetPicksBtn');
if(_rp) _rp.onclick=()=>{
  const key=currentDayKey(); state.picks[key]=defaultPicks(key); openSlot=null; save(); render(); toast('Back to defaults');
};

document.getElementById('finishBtn').onclick=async ()=>{
  const key=currentDayKey(), day=P()[key], logs=state.logs[key]||{};
  const nextLbl=P()[ORDER[(state.nextIndex+1)%ORDER.length]].label;
  if(state.viewIndex===state.nextIndex && !confirm(`Finish ${day.label} and move to ${nextLbl}?\n\nSaves your weights and advances the rotation.`)) return;
  // record this session's volume for the progress chart
  const vol=sessionVolume(key);
  if(vol>0){
    if(!state.sessions) state.sessions=[];
    state.sessions.push({ ts:Date.now(), day:key, vol:Math.round(vol) });
    if(state.sessions.length>90) state.sessions=state.sessions.slice(-90);
  }
  day.slots.forEach((slot,si)=>{
    const ex=chosen(key,si); if(ex.inc===0) return;
    const n=setCount(slot.scheme); let maxWt=null,doneCount=0;
    for(let s=0;s<n;s++){ const rec=logs[`${si}-${s}`]||{}; const w=parseFloat(rec.wt);
      if(!isNaN(w)) maxWt=(maxWt==null)?w:Math.max(maxWt,w); if(rec.done) doneCount++; }
    if(maxWt!=null) state.history[ex.name]={ wt:maxWt, allDone:doneCount===n };
  });
  if((state.coreOn||{})[key]){
    CORE[key].slots.forEach((slot,si)=>{
      const ex=coreChosen(key,si); if(ex.inc===0) return;
      const n=setCount(slot.scheme); let maxWt=null,doneCount=0;
      for(let s=0;s<n;s++){ const rec=logs[`c${si}-${s}`]||{}; const w=parseFloat(rec.wt);
        if(!isNaN(w)) maxWt=(maxWt==null)?w:Math.max(maxWt,w); if(rec.done) doneCount++; }
      if(maxWt!=null) state.history[ex.name]={ wt:maxWt, allDone:doneCount===n };
    });
  }
  state.logs[key]={};
  state.prSession={};
  if(state.viewIndex===state.nextIndex) state.nextIndex=(state.nextIndex+1)%ORDER.length;
  state.viewIndex=state.nextIndex; openSlot=null;
  await save(); render(); toast(`${day.label} saved — ${P()[ORDER[state.nextIndex]].label} is next`);
};
document.getElementById('resetBtn').onclick=async ()=>{ const key=currentDayKey(); state.logs[key]={}; await save(); render(); toast('Cleared'); };

document.querySelectorAll('.su-btn').forEach(b=>{ b.onclick=()=>switchSetup(b.dataset.setup); });

load();
</script>
